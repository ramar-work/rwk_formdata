<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8" />
	<meta name="Language" content="en" />
	<meta name="author" content="Antonio R. Collins II (ramar@ramarcollins.com)" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description" content="Library for simple, pretty validation.">
	<meta name="keywords" content="javascript,node,forms,npm">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;800&display=swap" rel="stylesheet">

	<title>Formdata Test</title>

	<link rel="stylesheet" href="app.css">
	<script defer src="../vendor/alpine.min.js"></script>
	<script src="../src/formdata.js"></script>
	<script src="app.js"></script>
</head>


<body>

<div x-data="app" class="back">

	<!-- This should have all been built in... but it's not... -->
	<form x-formdata @submit.prevent="console.log( $formdata )">
		<h1>Contact Us</h1>

		<div class="half">
			<div>
				<label>First Name*</label>
				<input name="fname" x-onerror="First name not specified">
			</div>
			<div>
				<label>Last Name*</label>
				<input name="lname" >
			</div>
		</div>

		<div>
			<label>Phone Number*</label>
			<input name="number">
		</div>

		<div>
			<label>Email Address*</label>
			<input name="email" >
		</div>

		<div class="half">
			<div>
				<label>City</label>
				<input name="city">
			</div>
			<div style="display: flex; gap: 8%;">
				<div style="width: 50%">
					<label>State</label>
					<select name="state" style="width: 100%">
						<option value="AL">AL</option>
						<option value="AK">AK</option>
						<option value="AZ">AZ</option>
						<option value="AR">AR</option>
						<option value="AS">AS</option>
						<option value="CA">CA</option>
						<option value="CO">CO</option>
						<option value="CT">CT</option>
						<option value="DE">DE</option>
						<option value="DC">DC</option>
						<option value="FL">FL</option>
						<option value="GA">GA</option>
						<option value="GU">GU</option>
						<option value="HI">HI</option>
						<option value="ID">ID</option>
						<option value="IL">IL</option>
						<option value="IN">IN</option>
						<option value="IA">IA</option>
						<option value="KS">KS</option>
						<option value="KY">KY</option>
						<option value="LA">LA</option>
						<option value="ME">ME</option>
						<option value="MD">MD</option>
						<option value="MA">MA</option>
						<option value="MI">MI</option>
						<option value="MN">MN</option>
						<option value="MS">MS</option>
						<option value="MO">MO</option>
						<option value="MT">MT</option>
						<option value="NE">NE</option>
						<option value="NV">NV</option>
						<option value="NH">NH</option>
						<option value="NJ">NJ</option>
						<option value="NM">NM</option>
						<option value="NY">NY</option>
						<option value="NC">NC</option>
						<option value="ND">ND</option>
						<option value="MP">MP</option>
						<option value="OH">OH</option>
						<option value="OK">OK</option>
						<option value="OR">OR</option>
						<option value="PA">PA</option>
						<option value="PR">PR</option>
						<option value="RI">RI</option>
						<option value="SC">SC</option>
						<option value="SD">SD</option>
						<option value="TN">TN</option>
						<option value="TX">TX</option>
						<option value="TT">TT</option>
						<option value="UT">UT</option>
						<option value="VT">VT</option>
						<option value="VA">VA</option>
						<option value="VI">VI</option>
						<option value="WA">WA</option>
						<option value="WV">WV</option>
						<option value="WI">WI</option>
						<option value="WY">WY</option>
					</select>
				</div>
				<div style="width: 50%">
					<label>Zip</label>
					<input name="zip">
				</div>
			</div>
		</div>

		<div>
			<div class="showhide">
				<label>Contact Preferences</label>
				<div @click="showPreferences = !showPreferences"
					:class="showPreferences ? 'toggled' : 'toggle'">&darr;</div>
			</div>
			<select x-transition x-show="showPreferences" name="preferences" style="display: block" multiple>
				<option value="email">Email</option>
				<option value="text">Text</option>
				<option value="phone">Phone</option>
			</select>
		</div>

		<div>
			<div class="showhide">
				<label>I'd like to add comments</label>
				<div @click="showComments = !showComments"
					:class="showComments ? 'toggled' : 'toggle'">&darr;</div>
			</div>
			<textarea x-transition x-show="showComments" name="comments"></textarea>
		</div>

		<div>	
			<input type="submit" value="Submit" style="width:50%; min-width: 100px; max-width: 200px;">
		</div>	

	</form>

</div>

</body>

</html>
